<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#061520" />
    <title>Vex</title>
    <link rel="stylesheet" href="/styles.css" />
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar" id="leftDrawer" aria-label="Main navigation">
            <div class="brand-block">
                <div class="brand-mark">V</div>
                <div class="brand-copy">
                    <span class="brand-name">VEX</span>
                    <span class="mini-tag">Always here. Always thinking.</span>
                </div>
            </div>

            <nav class="nav" aria-label="Sidebar navigation">
                <button class="nav-item active" type="button" data-action="new-chat">
                    <span class="nav-icon">💬</span>
                    <span>Chat</span>
                </button>
                <button class="nav-item" type="button" data-action="search-history">
                    <span class="nav-icon">⌕</span>
                    <span>Search</span>
                </button>
                <button class="nav-item" type="button" data-action="open-files">
                    <span class="nav-icon">▣</span>
                    <span>Files</span>
                </button>
                <button class="nav-item" type="button" data-action="settings">
                    <span class="nav-icon">⚙</span>
                    <span>Settings</span>
                </button>
            </nav>

            <button class="user-card" id="profileButton" type="button" aria-label="Open profile menu">
                <span class="user-avatar">K</span>
                <span class="user-details">
                    <span class="user-name">Kiplangat Ezra</span>
                    <span class="user-plan">Free Plan</span>
                </span>
                <span class="chevron">›</span>
            </button>
        </aside>

        <main class="workspace">
            <header class="topbar">
                <button id="openNavDrawer" class="mobile-panel-btn" type="button" aria-label="Open navigation menu"
                    aria-controls="leftDrawer" aria-expanded="false" title="Open navigation">
                    <span aria-hidden="true">☰</span>
                </button>
                <div class="topbar-spacer" aria-hidden="true"></div>
                <button id="openRecentDrawer" class="mobile-panel-btn" type="button" aria-label="Open recent chats"
                    aria-controls="rightDrawer" aria-expanded="false" title="Open recent chats">
                    <span aria-hidden="true">◷</span>
                </button>
                <div class="top-actions" aria-label="Top actions">
                    <button id="resetButton" class="icon-btn reset-mini" type="button" aria-label="Reset conversation"
                        title="Reset conversation">⟲</button>
                </div>
            </header>

            <div class="hero-wrap">
                <div id="emptyState" class="empty-state">
                    <div class="hero-mark">V</div>
                    <div class="hero-wordmark">VEX</div>
                    <h2>Welcome, <span id="welcomeDisplayName">Ezra</span>!</h2>
                    <p>How can I help you today?</p>

                    <div class="quick-actions">
                        <button type="button" data-quick-action="Explain something">Explain something</button>
                        <button type="button" data-quick-action="Help me plan">Help me plan</button>
                        <button type="button" data-quick-action="Give me ideas">Give me ideas</button>
                        <button type="button" data-quick-action="Just chat">Just chat</button>
                    </div>
                </div>

                <div id="chatMessages" class="chat-messages" aria-live="polite" aria-relevant="additions text"></div>
                <button id="jumpToLatest" class="jump-to-latest hidden" type="button"
                    aria-label="Jump to latest message">Jump to latest</button>
                <div id="typingIndicator" class="typing-indicator hidden" aria-live="polite" aria-label="Vex is typing">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span class="typing-label">typing…</span>
                </div>
            </div>

            <form id="chatForm" class="composer" autocomplete="off" aria-label="Send a message">
                <div class="composer-box">
                    <button class="tool-btn" type="button" aria-label="Add a file" data-action="open-files"
                        title="Add a file">＋</button>
                    <label class="sr-only" for="messageInput">Message</label>
                    <textarea id="messageInput" name="message" rows="1" maxlength="2000" placeholder="Message VEX..."
                        aria-label="Message VEX"></textarea>
                    <button id="voiceButton" class="voice-btn" type="button" aria-label="Start voice input"
                        data-state="idle" title="Voice input">
                        <span class="voice-icon" aria-hidden="true">◔</span>
                    </button>
                    <button type="submit" id="sendButton" class="send-btn" aria-label="Send message"
                        title="Send message" disabled>
                        <span aria-hidden="true">↑</span>
                    </button>
                    <button id="stopButton" class="send-btn stop-btn hidden" type="button" aria-label="Stop generation"
                        title="Stop generation">
                        <span aria-hidden="true">■</span>
                    </button>
                </div>
                <div class="composer-footer">
                    <span id="composerStatus" role="status" aria-live="polite">VEX can make mistakes. Check important
                        details.</span>
                    <span class="keyboard-hint"><kbd>Enter</kbd> to send <span aria-hidden="true">·</span>
                        <kbd>Shift</kbd> + <kbd>Enter</kbd> for a new line</span>
                </div>
            </form>
        </main>

        <aside class="right-rail" id="rightDrawer" aria-label="Conversation history panel">
            <div class="history-shell">
                <div class="history-header-row">
                    <h3>Chat history</h3>
                    <button class="history-panel-button" type="button" aria-label="Open history actions">◫</button>
                </div>

                <div class="history-search-wrap">
                    <span class="history-search-icon" aria-hidden="true">⌕</span>
                    <input id="historySearchInput" class="history-search-input" type="search" placeholder="Search..."
                        aria-label="Search chats" />
                </div>

                <ul class="history-list" id="recentList" aria-live="polite"></ul>

                <div class="history-panel-actions">
                    <button id="deleteSelectedButton" class="soft-action hidden" type="button">Delete selected</button>
                    <button id="createNewChatButton" class="primary-action" type="button">Create new chat</button>
                </div>
            </div>
        </aside>
        <button id="drawerScrim" class="drawer-scrim hidden" type="button" aria-label="Close side panel"></button>
    </div>

    <input id="filePicker" type="file" class="sr-only" aria-label="Select file" />

    <div id="appModal" class="app-modal hidden" aria-hidden="true">
        <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
            <div class="modal-header">
                <h3 id="modalTitle">VEX</h3>
                <button type="button" class="modal-close" id="closeModal" aria-label="Close dialog">×</button>
            </div>
            <div id="modalBody" class="modal-body"></div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>

</html>
